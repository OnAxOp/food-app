<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DesiNutri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #f3f4f6; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const FALLBACK_MODELS = ["gemini-3.5-flash", "gemini-3.1-flash", "gemini-2.5-flash", "gemini-1.5-flash"];

        const compressImageToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const MAX = 800;
                        let w = img.width, h = img.height;
                        if (w > h && w > MAX) { h *= MAX / w; w = MAX; } 
                        else if (h > MAX) { w *= MAX / h; h = MAX; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        const url = canvas.toDataURL('image/jpeg', 0.7); 
                        resolve({ base64: url.split(',')[1], mimeType: 'image/jpeg', url });
                    };
                }; reader.onerror = reject;
            });
        };

        const performApiCall = async (payload, apiKey) => {
            for (const model of FALLBACK_MODELS) {
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                    });
                    if (!res.ok) { if (res.status === 404) continue; throw new Error(`API Error ${res.status}`); }
                    const data = await res.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    let clean = text.trim();
                    const start = clean.indexOf('{'), end = clean.lastIndexOf('}');
                    if (start !== -1 && end !== -1) clean = clean.substring(start, end + 1);
                    return JSON.parse(clean);
                } catch (e) { if (e.message.includes("404")) continue; throw e; }
            }
            throw new Error(`API Key access denied.`);
        };

        const App = () => {
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
            const [tempKey, setTempKey] = useState('');
            const [activeTab, setActiveTab] = useState('home');
            
            const [dailyGoals, setDailyGoals] = useState(JSON.parse(localStorage.getItem('onax_goals') || '{"calories": 2200, "protein": 65, "carbs": 280, "fat": 60}'));
            const [showSettings, setShowSettings] = useState(false);
            const [tempGoals, setTempGoals] = useState(dailyGoals);

            const [favorites, setFavorites] = useState(JSON.parse(localStorage.getItem('onax_favs') || '[]'));
            const [mealsToday, setMealsToday] = useState(JSON.parse(localStorage.getItem('onax_history') || '[]'));
            const [selectedImage, setSelectedImage] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [analysisResult, setAnalysisResult] = useState(null);
            const [recipeText, setRecipeText] = useState("");
            const [isListening, setIsListening] = useState(false);
            
            const cameraInputRef = useRef(null);
            const galleryInputRef = useRef(null);

            useEffect(() => { localStorage.setItem('onax_goals', JSON.stringify(dailyGoals)); }, [dailyGoals]);
            useEffect(() => { localStorage.setItem('onax_favs', JSON.stringify(favorites)); }, [favorites]);
            useEffect(() => { localStorage.setItem('onax_history', JSON.stringify(mealsToday)); }, [mealsToday]);

            const consumed = mealsToday.reduce((acc, meal) => {
                acc.calories += meal.meal_totals?.calories || 0; 
                acc.protein += meal.meal_totals?.protein_grams || 0;
                acc.carbs += meal.meal_totals?.carbs_grams || 0; 
                acc.fat += meal.meal_totals?.fat_grams || 0;
                return acc;
            }, { calories: 0, protein: 0, carbs: 0, fat: 0 });

            const startVoice = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) return alert("Voice typing not supported on this device.");
                const recognition = new SpeechRecognition();
                recognition.onstart = () => setIsListening(true);
                recognition.onresult = (e) => setRecipeText(prev => prev + " " + e.results[0][0].transcript);
                recognition.onend = () => setIsListening(false);
                recognition.start();
            };

            const runImageAnalysis = async (imageData) => {
                setIsAnalyzing(true);
                setSelectedImage(imageData);
                setActiveTab('analysis');
                try {
                    const prompt = `Analyze this image of food or product packaging. Determine if each item is counted (pieces), in milliliters (ml), or in grams (g). JSON schema: {"meal_totals":{"calories":number,"protein_grams":number,"carbs_grams":number,"fat_grams":number},"foods":[{"food_name":"string","unit":"pieces|ml|g","amount":number,"base_calories":number,"base_protein":number,"base_carbs":number,"base_fat":number}]}`;
                    const payload = { 
                        contents: [{ 
                            role: "user", 
                            parts: [
                                { text: prompt }, 
                                { inlineData: { mimeType: imageData.mimeType, data: imageData.base64 } }
                            ] 
                        }], 
                        generationConfig: { responseMimeType: "application/json" } 
                    };
                    
                    const result = await performApiCall(payload, apiKey);
                    formatAndSetResult(result);
                } catch (err) { alert(`Error: ${err.message}`); setActiveTab('home'); } 
                finally { setIsAnalyzing(false); }
            };

            const runTextAnalysis = async (textData) => {
                if (!textData.trim()) return;
                setIsAnalyzing(true);
                setSelectedImage(null);
                setActiveTab('analysis');
                try {
                    const prompt = `Analyze this Indian recipe or food description: "${textData}". Determine if each item is counted (pieces), in milliliters (ml), or in grams (g). JSON schema: {"meal_totals":{"calories":number,"protein_grams":number,"carbs_grams":number,"fat_grams":number},"foods":[{"food_name":"string","unit":"pieces|ml|g","amount":number,"base_calories":number,"base_protein":number,"base_carbs":number,"base_fat":number}]}`;
                    const payload = { 
                        contents: [{ 
                            role: "user", 
                            parts: [{ text: prompt }] 
                        }], 
                        generationConfig: { responseMimeType: "application/json" } 
                    };
                    
                    const result = await performApiCall(payload, apiKey);
                    formatAndSetResult(result);
                } catch (err) { alert(`Error: ${err.message}`); setActiveTab('home'); } 
                finally { setIsAnalyzing(false); }
            };

            const formatAndSetResult = (result) => {
                const formattedFoods = result.foods.map(f => ({
                    food_name: f.food_name,
                    unit: f.unit || 'pieces',
                    amount: f.amount || 1,
                    unit_calories: (f.base_calories || 100) / (f.amount || 1),
                    unit_protein: (f.base_protein || 5) / (f.amount || 1),
                    unit_carbs: (f.base_carbs || 10) / (f.amount || 1),
                    unit_fat: (f.base_fat || 3) / (f.amount || 1)
                }));
                setAnalysisResult({ foods: formattedFoods });
            };

            const updateFoodAmount = (index, direction) => {
                if (!analysisResult) return;
                const updatedFoods = [...analysisResult.foods];
                const item = updatedFoods[index];
                let step = item.unit === 'ml' ? 100 : item.unit === 'g' ? 50 : 1;
                item.amount = Math.max(step, item.amount + (direction * step));
                setAnalysisResult({ ...analysisResult, foods: updatedFoods });
            };

            const computedTotals = analysisResult ? analysisResult.foods.reduce((acc, f) => {
                acc.calories += (f.unit_calories * f.amount);
                acc.protein += (f.unit_protein * f.amount);
                acc.carbs += (f.unit_carbs * f.amount);
                acc.fat += (f.unit_fat * f.amount);
                return acc;
            }, { calories: 0, protein: 0, carbs: 0, fat: 0 }) : { calories: 0, protein: 0, carbs: 0, fat: 0 };

            const handleImageSelect = async (e) => {
                if (!e.target.files?.[0]) return;
                const compressed = await compressImageToBase64(e.target.files[0]);
                runImageAnalysis(compressed);
            };

            const saveMeal = () => {
                if (analysisResult) {
                    const finalMeal = {
                        id: Date.now(),
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        imageUrl: selectedImage?.url || null,
                        meal_totals: {
                            calories: Math.round(computedTotals.calories),
                            protein_grams: Math.round(computedTotals.protein),
                            carbs_grams: Math.round(computedTotals.carbs),
                            fat_grams: Math.round(computedTotals.fat)
                        },
                        foods: analysisResult.foods.map(f => ({
                            food_name: f.food_name,
                            estimated_quantity: `${f.amount} ${f.unit}`,
                            calories: Math.round(f.unit_calories * f.amount)
                        }))
                    };
                    setMealsToday([finalMeal, ...mealsToday]);
                    setActiveTab('home'); setAnalysisResult(null); setSelectedImage(null); setRecipeText("");
                }
            };

            const toggleFav = (meal) => {
                if (favorites.find(f => f.id === meal.id)) setFavorites(favorites.filter(f => f.id !== meal.id));
                else setFavorites([...favorites, meal]);
            };

            if (!apiKey) return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-gray-900 p-4">
                    <div className="bg-white p-8 rounded-3xl w-full max-w-sm text-center">
                        <h2 className="text-2xl font-bold mb-2">DesiNutri</h2>
                        <input type="password" placeholder="API Key..." className="w-full p-4 bg-gray-50 rounded-xl mb-4" onChange={(e) => setTempKey(e.target.value)} />
                        <button onClick={() => { localStorage.setItem('gemini_api_key', tempKey); setApiKey(tempKey); }} className="w-full bg-orange-600 text-white py-4 rounded-xl font-bold">Start</button>
                    </div>
                </div>
            );

            return (
                <div className="flex justify-center items-center min-h-screen bg-gray-900 md:p-4">
                    <div className="w-full h-[100dvh] md:h-[850px] max-w-[400px] bg-white md:rounded-[2.5rem] flex flex-col relative overflow-hidden">
                        
                        {showSettings && (
                            <div className="absolute inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
                                <div className="bg-white rounded-3xl p-6 w-full shadow-2xl">
                                    <h3 className="font-bold text-xl mb-4 text-gray-800">Custom Goals</h3>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-xs text-gray-500 font-bold uppercase">Calories (kcal)</label>
                                            <input type="number" className="w-full border-b-2 border-orange-200 outline-none py-2 text-lg font-semibold" value={tempGoals.calories} onChange={e => setTempGoals({...tempGoals, calories: Number(e.target.value)})} />
                                        </div>
                                        <div className="flex gap-4">
                                            <div className="flex-1">
                                                <label className="text-xs text-gray-500 font-bold uppercase">Protein (g)</label>
                                                <input type="number" className="w-full border-b-2 border-orange-200 outline-none py-2 text-lg font-semibold" value={tempGoals.protein} onChange={e => setTempGoals({...tempGoals, protein: Number(e.target.value)})} />
                                            </div>
                                            <div className="flex-1">
                                                <label className="text-xs text-gray-500 font-bold uppercase">Carbs (g)</label>
                                                <input type="number" className="w-full border-b-2 border-orange-200 outline-none py-2 text-lg font-semibold" value={tempGoals.carbs} onChange={e => setTempGoals({...tempGoals, carbs: Number(e.target.value)})} />
                                            </div>
                                            <div className="flex-1">
                                                <label className="text-xs text-gray-500 font-bold uppercase">Fat (g)</label>
                                                <input type="number" className="w-full border-b-2 border-orange-200 outline-none py-2 text-lg font-semibold" value={tempGoals.fat} onChange={e => setTempGoals({...tempGoals, fat: Number(e.target.value)})} />
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex gap-3 mt-8">
                                        <button onClick={() => setShowSettings(false)} className="flex-1 py-3 rounded-xl font-bold bg-gray-100 text-gray-500">Cancel</button>
                                        <button onClick={() => { setDailyGoals(tempGoals); setShowSettings(false); }} className="flex-1 py-3 rounded-xl font-bold bg-orange-600 text-white shadow">Save</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="flex-1 overflow-y-auto pb-24 bg-gray-50">
                            
                            {activeTab === 'home' && (
                                <div>
                                    <div className="bg-orange-600 text-white p-6 rounded-b-[2rem] relative">
                                        <button onClick={() => { setTempGoals(dailyGoals); setShowSettings(true); }} className="absolute top-6 right-6 text-orange-200 text-xl"><i className="fa-solid fa-gear"></i></button>
                                        <h1 className="text-2xl font-bold">Today's Progress</h1>
                                        <div className="flex justify-between mt-4">
                                            <div><p className="text-sm">Calories Left</p><p className="text-3xl font-bold">{Math.max(0, dailyGoals.calories - consumed.calories)}</p></div>
                                            <div className="text-right"><p className="text-sm">Consumed</p><p className="text-xl font-semibold">{Math.round(consumed.calories)} kcal</p></div>
                                        </div>
                                    </div>
                                    <div className="p-6">
                                        <div className="bg-white p-5 rounded-2xl shadow-sm mb-6">
                                            <div className="mb-2"><span className="text-xs font-bold text-gray-500">PROTEIN ({Math.round(consumed.protein)}/{dailyGoals.protein}g)</span> <div className="h-2 bg-gray-200 rounded-full mt-1"><div className="h-2 bg-blue-500 rounded-full" style={{width: `${Math.min(100, consumed.protein/dailyGoals.protein*100)}%`}}></div></div></div>
                                            <div className="mb-2"><span className="text-xs font-bold text-gray-500">CARBS ({Math.round(consumed.carbs)}/{dailyGoals.carbs}g)</span> <div className="h-2 bg-gray-200 rounded-full mt-1"><div className="h-2 bg-green-500 rounded-full" style={{width: `${Math.min(100, consumed.carbs/dailyGoals.carbs*100)}%`}}></div></div></div>
                                            <div className="mb-2"><span className="text-xs font-bold text-gray-500">FAT ({Math.round(consumed.fat)}/{dailyGoals.fat}g)</span> <div className="h-2 bg-gray-200 rounded-full mt-1"><div className="h-2 bg-yellow-500 rounded-full" style={{width: `${Math.min(100, consumed.fat/dailyGoals.fat*100)}%`}}></div></div></div>
                                        </div>
                                        
                                        <div className="grid grid-cols-2 gap-3 mb-3">
                                            <button onClick={() => cameraInputRef.current?.click()} className="bg-orange-600 text-white py-4 rounded-2xl font-bold flex flex-col items-center shadow"><i className="fa-solid fa-camera text-xl mb-1"></i> Camera Scan</button>
                                            <button onClick={() => galleryInputRef.current?.click()} className="bg-amber-600 text-white py-4 rounded-2xl font-bold flex flex-col items-center shadow"><i className="fa-solid fa-image text-xl mb-1"></i> Gallery Upload</button>
                                        </div>
                                        <button onClick={() => setActiveTab('recipe')} className="w-full bg-white text-orange-600 border-2 border-orange-100 py-3 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-sm"><i className="fa-solid fa-pen"></i> Voice / Manual Log</button>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'analysis' && (
                                <div className="pb-10">
                                    <div className="bg-white px-4 py-3 shadow-sm flex items-center gap-3 sticky top-0 z-10">
                                        <button onClick={() => { setActiveTab('home'); setSelectedImage(null); }} className="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-700"><i className="fa-solid fa-chevron-left"></i></button>
                                        <h2 className="font-bold text-lg text-gray-800">Review & Save</h2>
                                    </div>

                                    {selectedImage && (
                                        <div className="w-full h-48 bg-black relative">
                                            <img src={selectedImage.url} alt="Scanned Food" className="w-full h-full object-cover opacity-90" />
                                        </div>
                                    )}

                                    <div className="p-4 -mt-4 relative z-10">
                                        {isAnalyzing ? (
                                            <div className="bg-white rounded-3xl p-10 shadow-xl flex flex-col items-center justify-center min-h-[250px]">
                                                <div className="w-12 h-12 border-4 border-orange-200 border-t-orange-600 rounded-full animate-spin mb-4"></div>
                                                <p className="font-bold text-gray-800 text-lg">Analyzing food...</p>
                                            </div>
                                        ) : analysisResult && (
                                            <div className="space-y-4">
                                                <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 flex items-center justify-between">
                                                    <div>
                                                        <p className="text-xs text-gray-400 uppercase font-bold tracking-wider">Total Energy</p>
                                                        <h3 className="text-3xl font-black text-orange-600 mt-1">{Math.round(computedTotals.calories)} <span className="text-sm font-normal text-gray-500">kcal</span></h3>
                                                    </div>
                                                    <div className="w-14 h-14 bg-orange-50 rounded-2xl flex items-center justify-center text-orange-600 text-2xl">
                                                        <i className="fa-solid fa-fire"></i>
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-3 gap-3">
                                                    <div className="bg-blue-50/70 border border-blue-100 p-3 rounded-2xl text-center">
                                                        <span className="block text-[10px] uppercase font-bold text-blue-500">Protein</span>
                                                        <span className="text-base font-bold text-blue-700">{Math.round(computedTotals.protein)}g</span>
                                                    </div>
                                                    <div className="bg-green-50/70 border border-green-100 p-3 rounded-2xl text-center">
                                                        <span className="block text-[10px] uppercase font-bold text-green-500">Carbs</span>
                                                        <span className="text-base font-bold text-green-700">{Math.round(computedTotals.carbs)}g</span>
                                                    </div>
                                                    <div className="bg-yellow-50/70 border border-yellow-100 p-3 rounded-2xl text-center">
                                                        <span className="block text-[10px] uppercase font-bold text-yellow-600">Fat</span>
                                                        <span className="text-base font-bold text-yellow-700">{Math.round(computedTotals.fat)}g</span>
                                                    </div>
                                                </div>

                                                <h4 className="font-bold text-gray-800 mt-6 px-1 text-sm uppercase tracking-wider">Adjust Amounts</h4>
                                                <div className="space-y-3">
                                                    {analysisResult.foods.map((f, i) => (
                                                        <div key={i} className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                                                            <div>
                                                                <p className="font-bold text-gray-800">{f.food_name}</p>
                                                                <p className="text-xs text-orange-600 font-semibold">{Math.round(f.unit_calories * f.amount)} kcal</p>
                                                            </div>
                                                            <div className="flex items-center gap-2 bg-gray-50 px-3 py-1.5 rounded-xl border border-gray-200">
                                                                <button onClick={() => updateFoodAmount(i, -1)} className="w-7 h-7 rounded-lg bg-white shadow-sm flex items-center justify-center text-gray-600 active:scale-95"><i className="fa-solid fa-minus text-xs"></i></button>
                                                                <span className="font-bold text-gray-800 text-sm min-w-[50px] text-center">{f.amount} {f.unit}</span>
                                                                <button onClick={() => updateFoodAmount(i, 1)} className="w-7 h-7 rounded-lg bg-white shadow-sm flex items-center justify-center text-gray-600 active:scale-95"><i className="fa-solid fa-plus text-xs"></i></button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>

                                                <button onClick={saveMeal} className="w-full bg-green-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-green-200 active:scale-95 transition-transform mt-6 flex items-center justify-center gap-2">
                                                    <i className="fa-solid fa-check"></i> Save to Today's Log
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {activeTab === 'recipe' && (
                                <div className="p-6">
                                    <h2 className="text-xl font-bold mb-4">Log Food Manually</h2>
                                    <div className="relative">
                                        <textarea className="w-full h-40 p-4 bg-white rounded-xl border outline-none" placeholder="e.g. 250ml milk and 2 boiled eggs..." value={recipeText} onChange={e=>setRecipeText(e.target.value)}></textarea>
                                        <button onClick={startVoice} className={`absolute bottom-4 right-4 w-10 h-10 rounded-full text-white shadow ${isListening ? 'bg-red-500 animate-pulse' : 'bg-orange-500'}`}><i className="fa-solid fa-microphone"></i></button>
                                    </div>
                                    <button onClick={() => runTextAnalysis(recipeText)} className="w-full bg-orange-600 text-white py-3 rounded-xl font-bold mt-4">Analyze Text</button>
                                </div>
                            )}

                            {activeTab === 'history' && (
                                <div className="p-6">
                                    <h2 className="text-xl font-bold mb-4">History & Favorites</h2>
                                    {mealsToday.length === 0 ? <p className="text-gray-400 text-center mt-10">No meals tracked today.</p> : 
                                    mealsToday.map(m => (
                                        <div key={m.id} className="bg-white p-4 rounded-xl shadow-sm mb-3 flex justify-between items-center">
                                            {m.imageUrl && <img src={m.imageUrl} alt="food" className="w-12 h-12 rounded-lg object-cover mr-3" />}
                                            <div className="flex-1"><p className="font-bold">{m.foods.map(f=>f.food_name).join(', ')}</p><p className="text-sm text-gray-500">{m.meal_totals.calories} kcal</p></div>
                                            <button onClick={() => toggleFav(m)} className={`text-xl ${favorites.find(f=>f.id===m.id) ? 'text-yellow-400' : 'text-gray-300'}`}><i className="fa-solid fa-star"></i></button>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {activeTab === 'analytics' && (
                                <div className="p-6">
                                    <h2 className="text-xl font-bold mb-6">Weekly Trends</h2>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm flex items-end justify-between h-48">
                                        {[
                                            consumed.calories > 0 ? Math.min(100, (consumed.calories / dailyGoals.calories) * 100) : 0,
                                            0, 0, 0, 0, 0, 0
                                        ].map((h, i) => (
                                            <div key={i} className="w-8 bg-orange-100 rounded-t-md relative h-full flex items-end">
                                                <div className="w-full bg-orange-600 rounded-t-md transition-all duration-500" style={{height: `${h}%`}}></div>
                                            </div>
                                        ))}
                                    </div>
                                    <p className="text-center text-sm text-gray-500 mt-4">Today's Calorie Progress vs Goal</p>
                                </div>
                            )}
                        </div>

                        {activeTab !== 'analysis' && (
                            <div className="absolute bottom-0 w-full bg-white border-t py-3 px-4 flex justify-around items-center z-40 shadow-lg">
                                <button onClick={()=>setActiveTab('home')} className={activeTab==='home'?'text-orange-600':'text-gray-400'}><i className="fa-solid fa-house text-xl"></i></button>
                                <button onClick={()=>setActiveTab('analytics')} className={activeTab==='analytics'?'text-orange-600':'text-gray-400'}><i className="fa-solid fa-chart-bar text-xl"></i></button>
                                <button onClick={()=>setActiveTab('recipe')} className={activeTab==='recipe'?'text-orange-600':'text-gray-400'}><i className="fa-solid fa-microphone text-xl"></i></button>
                                <button onClick={()=>setActiveTab('history')} className={activeTab==='history'?'text-orange-600':'text-gray-400'}><i className="fa-solid fa-clock-rotate-left text-xl"></i></button>
                            </div>
                        )}

                        <input type="file" accept="image/*" capture="camera" className="hidden" ref={cameraInputRef} onChange={handleImageSelect} />
                        <input type="file" accept="image/*" className="hidden" ref={galleryInputRef} onChange={handleImageSelect} />
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
