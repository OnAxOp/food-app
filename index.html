<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DesiNutri</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #f3f4f6; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const FALLBACK_MODELS = ["gemini-3.5-flash", "gemini-3.1-flash", "gemini-2.5-flash", "gemini-1.5-flash"];

        const compressImageToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const MAX = 800;
                        let w = img.width, h = img.height;
                        if (w > h && w > MAX) { h *= MAX / w; w = MAX; } 
                        else if (h > MAX) { w *= MAX / h; h = MAX; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        const url = canvas.toDataURL('image/jpeg', 0.7); 
                        resolve({ base64: url.split(',')[1], mimeType: 'image/jpeg', url });
                    };
                }; reader.onerror = reject;
            });
        };

        const performApiCall = async (payload, apiKey) => {
            for (const model of FALLBACK_MODELS) {
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                    });
                    if (!res.ok) { if (res.status === 404) continue; throw new Error(`API Error ${res.status}`); }
                    const data = await res.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    let clean = text.trim();
                    const start = clean.indexOf('{'), end = clean.lastIndexOf('}');
                    if (start !== -1 && end !== -1) clean = clean.substring(start, end + 1);
                    return JSON.parse(clean);
                } catch (e) { if (e.message.includes("404")) continue; throw e; }
            }
            throw new Error(`API Key access denied.`);
        };

        const App = () => {
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
            const [tempKey, setTempKey] = useState('');
            const [activeTab, setActiveTab] = useState('home');
            
            // Goals & Settings State
            const [dailyGoals, setDailyGoals] = useState(JSON.parse(localStorage.getItem('onax_goals') || '{"calories": 2200, "protein": 65, "carbs": 280, "fat": 60}'));
            const [showSettings, setShowSettings] = useState(false);
            const [tempGoals, setTempGoals] = useState(dailyGoals);

            const [favorites, setFavorites] = useState(JSON.parse(localStorage.getItem('onax_favs') || '[]'));
            const [mealsToday, setMealsToday] = useState([]);
            const [selectedImage, setSelectedImage] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [analysisResult, setAnalysisResult] = useState(null);
            const [recipeText, setRecipeText] = useState("");
            const [isListening, setIsListening] = useState(false);
            const fileInputRef = useRef(null);

            useEffect(() => { localStorage.setItem('onax_goals', JSON.stringify(dailyGoals)); }, [dailyGoals]);
            useEffect(() => { localStorage.setItem('onax_favs', JSON.stringify(favorites)); }, [favorites]);

            const consumed = mealsToday.reduce((acc, meal) => {
                acc.calories += meal.meal_totals?.calories || 0; acc.protein += meal.meal_totals?.protein_grams || 0;
                acc.carbs += meal.meal_totals?.carbs_grams || 0; acc.fat += meal.meal_totals?.fat_grams || 0;
                return acc;
            }, { calories: 0, protein: 0, carbs: 0, fat: 0 });

            const startVoice = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) return alert("Voice typing not supported on this device.");
                const recognition = new SpeechRecognition();
                recognition.onstart = () => setIsListening(true);
                recognition.onresult = (e) => setRecipeText(prev => prev + " " + e.results[0][0].transcript);
                recognition.onend = () => setIsListening(false);
                recognition.start();
            };

            const runAnalysis = async (imageData, textData) => {
                setIsAnalyzing(true);
                try {
                    const prompt = imageData ? 
                        `Analyze this image of Indian food. JSON schema: {"meal_totals":{"calories":number,"protein_grams":number,"carbs_grams":number,"fat_grams":number,"fiber_grams":number},"foods":[{"food_name":"string","estimated_quantity":"string","calories":number,"confidence":"High"}]}` : 
                        `Analyze this Indian recipe: "${textData}". JSON schema: {"meal_totals":{"calories":number,"protein_grams":number,"carbs_grams":number,"fat_grams":number,"fiber_grams":number},"foods":[{"food_name":"string","estimated_quantity":"string","calories":number,"confidence":"High"}]}`;
                    
                    const payload = { contents: [{ role: "user", parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } };
                    if (imageData) payload.contents[0].parts.push({ inlineData: { mimeType: imageData.mimeType, data: imageData.base64 } });
                    
                    const result = await performApiCall(payload, apiKey);
                    setAnalysisResult(result);
                } catch (err) { alert(`Error: ${err.message}`); } 
                finally { setIsAnalyzing(false); }
            };

            const handleImageCapture = async (e) => {
                if (!e.target.files?.[0]) return;
                const compressed = await compressImageToBase64(e.target.files[0]);
                setSelectedImage(compressed); setActiveTab('analysis'); runAnalysis(compressed, null);
            };

            const saveMeal = () => {
                if (analysisResult) {
                    setMealsToday([{ ...analysisResult, id: Date.now(), timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }, ...mealsToday]);
                    setActiveTab('home'); setAnalysisResult(null); setSelectedImage(null);
                }
            };

            const toggleFav = (meal) => {
                if (favorites.find(f => f.id === meal.id)) setFavorites(favorites.filter(f => f.id !== meal.id));
                else setFavorites([...favorites, meal]);
            };

            if (!apiKey) return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-gray-900 p-4">
                    <div className="bg-white p-8 rounded-3xl w-full max-w-sm text-center">
                        <h2 className="text-2xl font-bold mb-2">DesiNutri</h2>
                        <input type="password" placeholder="API Key..." className="w-full p-4 bg-gray-50 rounded-xl mb-4" onChange={(e) => setTempKey(e.target.value)} />
                        <button onClick={() => { localStorage.setItem('gemini_api_key', tempKey); setApiKey(tempKey); }} className="w-full bg-orange-600 text-white py-4 rounded-xl font-bold">Start</button>
                    </div>
                </div>
            );

            return (
                <div className="flex justify-center items-center min-h-screen bg-gray-900 md:p-4">
                    <div className="w-full h-[100dvh] md:h-[850px] max-w-[400px] bg-white md:rounded-[2.5rem] flex flex-col relative overflow-hidden">
                        
                        {/* GOALS SETTINGS MODAL */}
                        {showSettings && (
                            <div className="absolute inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
                                <div className="bg-white rounded-3xl p-6 w-full shadow-2xl">
                                    <h3 className="font-bold text-xl mb-4 text-gray-800">Custom Goals</h3>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-xs text-gray-500 font-bold uppercase">Calories (kcal)</label>
                                            <input type="number" className="w-full border-b-2 border-orange-200 outline-none py-2 text-lg font-semibold" value={tempGoals.calories} onChange={e => setTempGoals({...tempGoals, calories: Number(e.target.value)})} />
                                        </div>
                                        <div className="flex gap-4">
                                            <div className="flex-1">
                                                <label className="text-xs text-gray-500 font-bold uppercase">Protein (g)</label>
                                                <input type="number" className="w-full border-b-2 border-orange-200 outline-none py-2 text-lg font-semibold" value={tempGoals.protein} onChange={e => setTempGoals({...tempGoals, protein: Number(e.target.value)})} />
                                            </div>
                                            <div className="flex-1">
                                                <label className="text-xs text-gray-500 font-bold uppercase">Carbs (g)</label>
                                                <input type="number" className="w-full border-b-2 border-orange-200 outline-none py-2 text-lg font-semibold" value={tempGoals.carbs} onChange={e => setTempGoals({...tempGoals, carbs: Number(e.target.value)})} />
                                            </div>
                                            <div className="flex-1">
                                                <label className="text-xs text-gray-500 font-bold uppercase">Fat (g)</label>
                                                <input type="number" className="w-full border-b-2 border-orange-200 outline-none py-2 text-lg font-semibold" value={tempGoals.fat} onChange={e => setTempGoals({...tempGoals, fat: Number(e.target.value)})} />
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex gap-3 mt-8">
                                        <button onClick={() => setShowSettings(false)} className="flex-1 py-3 rounded-xl font-bold bg-gray-100 text-gray-500">Cancel</button>
                                        <button onClick={() => { setDailyGoals(tempGoals); setShowSettings(false); }} className="flex-1 py-3 rounded-xl font-bold bg-orange-600 text-white shadow">Save</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="flex-1 overflow-y-auto pb-24 bg-gray-50">
                            
                            {/* HOME */}
                            {activeTab === 'home' && (
                                <div>
                                    <div className="bg-orange-600 text-white p-6 rounded-b-[2rem] relative">
                                        <button onClick={() => { setTempGoals(dailyGoals); setShowSettings(true); }} className="absolute top-6 right-6 text-orange-200 text-xl"><i className="fa-solid fa-gear"></i></button>
                                        <h1 className="text-2xl font-bold">Today's Progress</h1>
                                        <div className="flex justify-between mt-4">
                                            <div><p className="text-sm">Calories Left</p><p className="text-3xl font-bold">{Math.max(0, dailyGoals.calories - consumed.calories)}</p></div>
                                            <div className="text-right"><p className="text-sm">Consumed</p><p className="text-xl font-semibold">{Math.round(consumed.calories)} kcal</p></div>
                                        </div>
                                    </div>
                                    <div className="p-6">
                                        <div className="bg-white p-5 rounded-2xl shadow-sm mb-6">
                                            <div className="mb-2"><span className="text-xs font-bold text-gray-500">PROTEIN ({Math.round(consumed.protein)}/{dailyGoals.protein}g)</span> <div className="h-2 bg-gray-200 rounded-full mt-1"><div className="h-2 bg-blue-500 rounded-full" style={{width: `${Math.min(100, consumed.protein/dailyGoals.protein*100)}%`}}></div></div></div>
                                            <div className="mb-2"><span className="text-xs font-bold text-gray-500">CARBS ({Math.round(consumed.carbs)}/{dailyGoals.carbs}g)</span> <div className="h-2 bg-gray-200 rounded-full mt-1"><div className="h-2 bg-green-500 rounded-full" style={{width: `${Math.min(100, consumed.carbs/dailyGoals.carbs*100)}%`}}></div></div></div>
                                            <div className="mb-2"><span className="text-xs font-bold text-gray-500">FAT ({Math.round(consumed.fat)}/{dailyGoals.fat}g)</span> <div className="h-2 bg-gray-200 rounded-full mt-1"><div className="h-2 bg-yellow-500 rounded-full" style={{width: `${Math.min(100, consumed.fat/dailyGoals.fat*100)}%`}}></div></div></div>
                                        </div>
                                        <div className="flex gap-4">
                                            <button onClick={() => fileInputRef.current?.click()} className="flex-1 bg-orange-600 text-white py-4 rounded-2xl font-bold flex flex-col items-center"><i className="fa-solid fa-camera text-2xl mb-1"></i> Scan</button>
                                            <button onClick={() => setActiveTab('recipe')} className="flex-1 bg-white text-orange-600 border-2 border-orange-100 py-4 rounded-2xl font-bold flex flex-col items-center"><i className="fa-solid fa-pen text-2xl mb-1"></i> Voice/Text</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* ANALYSIS */}
                            {activeTab === 'analysis' && (
                                <div className="p-4">
                                    <button onClick={() => setActiveTab('home')} className="mb-4"><i className="fa-solid fa-chevron-left text-xl"></i></button>
                                    {isAnalyzing ? <div className="text-center mt-20"><div className="w-10 h-10 border-4 border-orange-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div><p>Analyzing...</p></div> : 
                                    analysisResult && (
                                        <div className="space-y-4">
                                            <h2 className="text-2xl font-bold text-orange-600">{analysisResult.meal_totals.calories} kcal</h2>
                                            <p className="text-sm font-bold text-gray-500">P: {analysisResult.meal_totals.protein_grams}g | C: {analysisResult.meal_totals.carbs_grams}g | F: {analysisResult.meal_totals.fat_grams}g</p>
                                            {analysisResult.foods.map((f, i) => <div key={i} className="bg-white p-3 rounded-xl shadow-sm"><span className="font-bold">{f.food_name}</span> - {f.calories} kcal</div>)}
                                            <button onClick={saveMeal} className="w-full bg-green-600 text-white py-3 rounded-xl font-bold mt-4">Save Meal</button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* RECIPE / VOICE */}
                            {activeTab === 'recipe' && (
                                <div className="p-6">
                                    <h2 className="text-xl font-bold mb-4">Log Food Manually</h2>
                                    <div className="relative">
                                        <textarea className="w-full h-40 p-4 bg-white rounded-xl border outline-none" placeholder="e.g. 2 parathas with curd..." value={recipeText} onChange={e=>setRecipeText(e.target.value)}></textarea>
                                        <button onClick={startVoice} className={`absolute bottom-4 right-4 w-10 h-10 rounded-full text-white shadow ${isListening ? 'bg-red-500 animate-pulse' : 'bg-orange-500'}`}><i className="fa-solid fa-microphone"></i></button>
                                    </div>
                                    <button onClick={() => {setActiveTab('analysis'); runAnalysis(null, recipeText);}} className="w-full bg-orange-600 text-white py-3 rounded-xl font-bold mt-4">Analyze</button>
                                </div>
                            )}

                            {/* HISTORY & FAVS */}
                            {activeTab === 'history' && (
                                <div className="p-6">
                                    <h2 className="text-xl font-bold mb-4">History & Favorites</h2>
                                    {mealsToday.length === 0 ? <p className="text-gray-400 text-center mt-10">No meals tracked today.</p> : 
                                    mealsToday.map(m => (
                                        <div key={m.id} className="bg-white p-4 rounded-xl shadow-sm mb-3 flex justify-between items-center">
                                            <div><p className="font-bold">{m.foods.map(f=>f.food_name).join(', ')}</p><p className="text-sm text-gray-500">{m.meal_totals.calories} kcal</p></div>
                                            <button onClick={() => toggleFav(m)} className={`text-xl ${favorites.find(f=>f.id===m.id) ? 'text-yellow-400' : 'text-gray-300'}`}><i className="fa-solid fa-star"></i></button>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {/* ANALYTICS */}
                            {activeTab === 'analytics' && (
                                <div className="p-6">
                                    <h2 className="text-xl font-bold mb-6">Weekly Trends</h2>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm flex items-end justify-between h-48">
                                        {[60, 80, 40, 90, 75, 50, Math.min(100, consumed.calories/dailyGoals.calories*100)].map((h, i) => (
                                            <div key={i} className="w-8 bg-orange-200 rounded-t-md relative h-full flex items-end">
                                                <div className="w-full bg-orange-600 rounded-t-md" style={{height: `${h}%`}}></div>
                                            </div>
                                        ))}
                                    </div>
                                    <p className="text-center text-sm text-gray-500 mt-4">7-Day Calorie Average Progress</p>
                                </div>
                            )}
                        </div>

                        {/* BOTTOM NAV */}
                        <div className="absolute bottom-0 w-full bg-white border-t py-3 px-4 flex justify-between items-center z-40 shadow-lg">
                            <button onClick={()=>setActiveTab('home')} className={activeTab==='home'?'text-orange-600':'text-gray-400'}><i className="fa-solid fa-house text-xl"></i></button>
                            <button onClick={()=>setActiveTab('analytics')} className={activeTab==='analytics'?'text-orange-600':'text-gray-400'}><i className="fa-solid fa-chart-bar text-xl"></i></button>
                            <button onClick={()=>fileInputRef.current?.click()} className="bg-orange-600 text-white w-14 h-14 rounded-full -mt-8 flex items-center justify-center shadow-lg active:scale-95"><i className="fa-solid fa-camera text-xl"></i></button>
                            <button onClick={()=>setActiveTab('recipe')} className={activeTab==='recipe'?'text-orange-600':'text-gray-400'}><i className="fa-solid fa-microphone text-xl"></i></button>
                            <button onClick={()=>setActiveTab('history')} className={activeTab==='history'?'text-orange-600':'text-gray-400'}><i className="fa-solid fa-clock-rotate-left text-xl"></i></button>
                        </div>
                        <input type="file" accept="image/*" className="hidden" ref={fileInputRef} onChange={handleImageCapture} />
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
