name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Prepare Web Files
        run: |
          mkdir www
          cp index.html www/

      - name: Setup App Environment
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Android App
        run: |
          npx cap init DesiNutri com.desinutri.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin Version Conflict
        run: |
          echo "allprojects { configurations.all { resolutionStrategy.eachDependency { DependencyResolveDetails details -> if (details.requested.group == 'org.jetbrains.kotlin') { details.useVersion '1.8.22' } } } }" >> android/build.gradle

      - name: Set Custom Version Name
        run: |
          sed -i 's/versionName "1.0"/versionName "ONAX"/g' android/app/build.gradle

      - name: Build the APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: DesiNutri-ONAX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
